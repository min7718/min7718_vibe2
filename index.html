<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💪 내 몸 건강 체크업! 비만도 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html { scroll-behavior: smooth; }
        .gradient-bg { background: linear-gradient(135deg, #111827 0%, #312e81 100%); }
    </style>
</head>
<body class="bg-slate-950 font-sans text-slate-100 antialiased min-h-screen flex flex-col justify-center items-center p-4">

    <main class="max-w-md w-full bg-slate-900/80 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-slate-800 space-y-6">
        
        <div class="text-center space-y-2">
            <span class="text-5xl block animate-bounce">⚖️</span>
            <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
                팩폭 유발 비만도 검사
            </h1>
            <p class="text-slate-400 text-xs">눈감아 내 몸무게... 과학적인 데이터로 직면해봅시다.</p>
        </div>

        <hr class="border-slate-800">

        <div id="input-section" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">키 (신장)</label>
                <div class="relative">
                    <input type="number" id="height" placeholder="예: 175" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl py-3 px-4 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 font-bold">
                    <span class="absolute right-4 top-3 text-sm text-slate-400">cm</span>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">몸무게 (체중)</label>
                <div class="relative">
                    <input type="number" id="weight" placeholder="예: 70" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl py-3 px-4 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 font-bold">
                    <span class="absolute right-4 top-3 text-sm text-slate-400">kg</span>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">허리둘레 (선택 - 복부비만 측정)</label>
                <div class="relative">
                    <input type="number" id="waist" placeholder="예: 32 (인치 또는 cm 둘 다 가능)" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl py-3 px-4 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 font-bold">
                    <select id="waist-unit" class="absolute right-2 top-2 bg-slate-700 text-xs text-white rounded-lg p-1.5 focus:outline-none">
                        <option value="inch">inch</option>
                        <option value="cm">cm</option>
                    </select>
                </div>
            </div>

            <button onclick="calculateBMI()" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-600 hover:to-cyan-600 text-slate-950 font-black py-4 px-6 rounded-2xl shadow-lg shadow-cyan-500/10 transition-all transform hover:-translate-y-0.5 active:translate-y-0 text-md cursor-pointer mt-2">
                결과 확인하기 🚀
            </button>
        </div>

        <div id="result-section" class="hidden space-y-5 pt-2 animate-fade-in">
            <div class="bg-slate-950/60 p-5 rounded-2xl border border-slate-800 text-center space-y-3">
                <p class="text-xs text-slate-400 font-semibold tracking-wider">당신의 체질량지수(BMI)</p>
                <div id="bmi-value" class="text-5xl font-black tracking-tight text-white">24.5</div>
                <div id="bmi-status" class="inline-block bg-amber-500/20 text-amber-400 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/30">
                    과체중 ⚠️
                </div>
            </div>

            <div class="space-y-1">
                <div class="flex justify-between text-[10px] text-slate-500 font-bold px-1">
                    <span>저체중 (18.5)</span>
                    <span>정상 (23)</span>
                    <span>과체중 (25)</span>
                    <span>비만</span>
                </div>
                <div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden relative">
                    <div id="bmi-bar" class="h-full bg-gradient-to-r from-blue-400 via-emerald-400 via-amber-400 to-red-500 transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

            <div id="waist-result-box" class="hidden bg-slate-800/40 p-4 rounded-xl text-sm border border-slate-700/50">
                <span class="font-bold text-slate-300">💡 허리둘레 코멘트:</span> 
                <span id="waist-status-text" class="text-slate-400">안전 영역입니다.</span>
            </div>

            <div class="bg-slate-800/30 p-4 rounded-xl space-y-2 text-left">
                <h4 class="text-xs font-bold text-indigo-400 flex items-center gap-1">
                    <span>📋</span> 뼈 때리는 건강 처방전
                </h4>
                <p id="health-tip" class="text-xs text-slate-300 leading-relaxed"></p>
            </div>

            <button onclick="resetApp()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 px-6 rounded-xl text-xs transition-all cursor-pointer">
                다시 측정하기 🔄
            </button>
        </div>

    </main>

    <script>
        function calculateBMI() {
            const heightInput = document.getElementById('height').value;
            const weightInput = document.getElementById('weight').value;
            const waistInput = document.getElementById('waist').value;
            const waistUnit = document.getElementById('waist-unit').value;

            // 유효성 검사
            if (!heightInput || !weightInput) {
                alert("키와 몸무게를 올바르게 입력해주세요! 🥺");
                return;
            }

            const heightMeter = heightInput / 100;
            const weight = parseFloat(weightInput);
            
            // BMI 계산 수식: 체중(kg) / 신장(m)^2
            const bmi = (weight / (heightMeter * heightMeter)).toFixed(1);

            // 상태 및 디자인 매핑
            let status = "";
            let colorClass = "";
            let barWidth = "";
            let tip = "";

            if (bmi < 18.5) {
                status = "저체중 🍃";
                barWidth = "25%";
                tip = "앗... 바람 불면 날아갈 것 같아요! 규칙적인 식사와 근력 운동으로 건강한 벌크업이 시급합니다. 야식으로 치킨 고?";
            } else if (bmi >= 18.5 && bmi < 23) {
                status = "정상 체중 ✨";
                barWidth = "50%";
                tip = "완벽한 황금 밸런스! 유지하는 게 가장 어려운 거 아시죠? 지금처럼만 클린하게 먹고 꾸준히 움직여주세요. 최고입니다!";
            } else if (bmi >= 23 && bmi < 25) {
                status = "과체중 (비만 위험군) ⚠️";
                barWidth = "70%";
                tip = "방심은 금물! 야금야금 살이 오르고 있는 단계입니다. 오늘부터 액상과당(콜라, 탕후루 등) 끊고 엘리베이터 대신 계단을 이용해 보세요.";
            } else if (bmi >= 25 && bmi < 30) {
                status = "경도 비만 🚨";
                barWidth = "85%";
                tip = "위험 신호 발동! 몸이 무겁다고 느끼지 않으셨나요? 맛있는 배달 음식과 잠시 이별하고 하루 30분씩 유산소 운동을 시작합시다.";
            } else {
                status = "고도 비만 ⛔";
                barWidth = "100%";
                tip = "긴급 비상사태! 관절과 혈관이 소리 지르고 있습니다. 미용 목적이 아니라 생존을 위해 식단 관리와 전문가의 도움을 권장합니다.";
            }

            // 데이터 반영
            document.getElementById('bmi-value').innerText = bmi;
            document.getElementById('bmi-status').innerText = status;
            document.getElementById('health-tip').innerText = tip;

            // 바 애니메이션 연출을 위한 타이밍 조절
            setTimeout(() => {
                document.getElementById('bmi-bar').style.width = barWidth;
            }, 100);

            // 허리둘레 조건부 계산 (복부비만 기준 가이드 반영)
            const waistBox = document.getElementById('waist-result-box');
            if (waistInput) {
                let waistCm = parseFloat(waistInput);
                if (waistUnit === 'inch') {
                    waistCm = waistCm * 2.54; // 인치를 cm로 변환
                }
                
                let waistStatus = "";
                // 한국 성인 기준 복부비만 기준 (남 90cm 이상, 여 85cm 이상이나 여기서는 범용 가이드 적용)
                if (waistCm >= 90) {
                    waistStatus = `허리둘레가 약 ${waistCm.toFixed(1)}cm로 내장지방이 의심됩니다. 뱃살 들어갈 시간입니다! 🏃‍♂️`;
                } else {
                    waistStatus = `허리둘레 약 ${waistCm.toFixed(1)}cm로 복부 비만 수치는 비교적 안전한 편입니다. 안심하되 방심은 금물! 👍`;
                }
                document.getElementById('waist-status-text').innerText = waistStatus;
                waistBox.classList.remove('hidden');
            } else {
                waistBox.classList.add('hidden');
            }

            // 섹션 전환
            document.getElementById('result-section').classList.remove('hidden');
            // 부드럽게 아래 결과 화면으로 스크롤
            document.getElementById('result-section').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function resetApp() {
            // 입력창 리셋
            document.getElementById('height').value = '';
            document.getElementById('weight').value = '';
            document.getElementById('waist').value = '';
            document.getElementById('bmi-bar').style.width = '0%';
            
            // 결과창 숨기기
            document.getElementById('result-section').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
